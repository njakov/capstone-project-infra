apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.secretStoreName | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: github-app-sync
spec:
  provider:
    gcpsm:
      projectID: {{ required "projectID is required" .Values.projectID | quote }}
      auth:
        workloadIdentity:
          serviceAccountRef:
            name: {{ required "serviceAccountName is required" .Values.serviceAccountName | quote }}
