apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecretName | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: github-app-sync
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: {{ .Values.secretStoreName | quote }}
    kind: SecretStore
  target:
    name: {{ .Values.targetSecretName | quote }}
    creationPolicy: Owner
  data:
    - secretKey: github_app_id
      remoteRef:
        key: {{ required "githubAppIdSecretId is required" .Values.githubAppIdSecretId | quote }}
    - secretKey: github_app_installation_id
      remoteRef:
        key: {{ required "githubAppInstallationIdSecretId is required" .Values.githubAppInstallationIdSecretId | quote }}
    - secretKey: github_app_private_key
      remoteRef:
        key: {{ required "githubAppPrivateKeySecretId is required" .Values.githubAppPrivateKeySecretId | quote }}
