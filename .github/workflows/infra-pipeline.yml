name: Main Infrastructure Pipeline

on:
  # Automatic Trigger: Runs 'Plan' on Dev when code is pushed to main
  push:
    branches: [ "main" ]
    paths:
      - 'environments/**'
      - 'modules/**'
      - '.github/workflows/infra-pipeline.yml'

  # Manual Trigger: Allows selecting Environment and Action
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      action:
        description: 'Terraform Action'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
      ref:
        description: 'Branch/Tag to checkout (Optional)'
        required: false
        type: string

permissions:
  contents: read

# Prevent overlapping runs on the same environment
concurrency:
  group: ${{ github.workflow }}-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  setup:
    name: Setup Context
    runs-on: ubuntu-latest
    outputs:
      runner_label: ${{ steps.set-context.outputs.runner_label }}
      work_dir: ${{ steps.set-context.outputs.work_dir }}
      environment: ${{ steps.set-context.outputs.environment }}
      ref_to_checkout: ${{ steps.set-context.outputs.ref_to_checkout }}
    steps:
      - id: set-context
        name: Determine Context
        env:
          INPUT_ENV: ${{ inputs.environment }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_ACTION: ${{ inputs.action }}
          GITHUB_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1. Determine Environment and the ref to resolve once for this run.
          # Push is already a commit. Dispatch uses the optional input, else the
          # commit of the workflow file selected in the UI.
          if [ "$EVENT_NAME" = "push" ]; then
            ENV="dev"
            RAW_REF="${GITHUB_SHA}"
          else
            ENV="${INPUT_ENV:-dev}"
            RAW_REF="${INPUT_REF:-${GITHUB_SHA}}"
          fi

          case "$ENV" in
            dev|prod) ;;
            *)
              echo "::error::Invalid environment."
              exit 1
              ;;
          esac

          # A newline in ref would add extra $GITHUB_OUTPUT lines and overwrite
          # environment, work_dir, or runner_label. EOF is the output delimiter.
          case "$RAW_REF" in
            ""|EOF|*$'\n'*|*$'\r'*)
              echo "::error::Invalid ref."
              exit 1
              ;;
          esac

          # 2. Pin every later job to this SHA. Branch and tag names are
          # resolved once here so a moving ref cannot change between jobs.
          encoded_ref="$(jq -rn --arg r "${RAW_REF}" '$r|@uri')"
          SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${encoded_ref}" --jq .sha)"
          if ! printf '%s' "${SHA}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Could not resolve ref to a commit SHA."
            exit 1
          fi

          # 3. Prod SHA gate. Plan may use the tip of main (identical) or an
          # ancestor (behind). Apply and destroy must be the current tip of
          # main (identical only). Dev may pin any resolved SHA.
          if [ "$ENV" = "prod" ]; then
            compare_status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${SHA}" --jq .status)"
            if [ "$EVENT_NAME" = "workflow_dispatch" ] && { [ "$INPUT_ACTION" = "apply" ] || [ "$INPUT_ACTION" = "destroy" ]; }; then
              case "$compare_status" in
                identical) ;;
                *)
                  echo "::error title=Deployment Denied::Prod apply/destroy require the current tip of main (compare status: ${compare_status})."
                  exit 1
                  ;;
              esac
            else
              case "$compare_status" in
                identical|behind) ;;
                *)
                  echo "::error title=Deployment Denied::Commit ${SHA} is not contained in main (compare status: ${compare_status})."
                  exit 1
                  ;;
              esac
            fi

            # 4. Prod apply/destroy: fail closed if the Environment has no
            # required reviewers. github.token must be able to GET
            # /repos/{owner}/{repo}/environments/prod (contents:read is enough
            # when Actions can read the repo; a 403 means raise Workflow
            # permissions or use a token that can read Environments).
            if [ "$EVENT_NAME" = "workflow_dispatch" ] && { [ "$INPUT_ACTION" = "apply" ] || [ "$INPUT_ACTION" = "destroy" ]; }; then
              # Token must read GET /repos/{owner}/{repo}/environments/prod.
              if ! reviewer_rules="$(gh api "repos/${GITHUB_REPOSITORY}/environments/prod" --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length')"; then
                echo "::error::Could not read the prod Environment. github.token needs permission to GET /repos/{owner}/{repo}/environments/prod."
                exit 1
              fi
              if [ "${reviewer_rules}" = "0" ] || [ -z "${reviewer_rules}" ]; then
                echo "::error::Prod Environment has no required reviewers. Add them under Settings → Environments → prod before apply/destroy."
                exit 1
              fi
            fi
          fi

          # 5. Output Variables
          echo "Selected Environment: $ENV"
          echo "Selected Ref: $SHA"

          {
            echo "environment<<EOF"
            echo "$ENV"
            echo "EOF"
            echo "work_dir<<EOF"
            echo "environments/$ENV"
            echo "EOF"
            echo "runner_label<<EOF"
            echo "$ENV"
            echo "EOF"
            echo "ref_to_checkout<<EOF"
            echo "$SHA"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  # Validate & Scan
  validate_and_scan:
    name: Validate & Scan
    needs: setup
    runs-on: [self-hosted, infra, "${{ needs.setup.outputs.runner_label }}"]
    # GitHub Environment is for deployment protection, not GCP project ids.
    environment: ${{ needs.setup.outputs.environment }}
    defaults:
      run:
        working-directory: ${{ needs.setup.outputs.work_dir }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.ref_to_checkout }}

      - name: Inject Terraform variables from Environment
        env:
          ALLOWED_SOURCE_RANGES: ${{ vars.ALLOWED_SOURCE_RANGES }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          TARGET_ENV: ${{ needs.setup.outputs.environment }}
        run: |
          if [ -z "${ALLOWED_SOURCE_RANGES}" ]; then
            echo "::error::ALLOWED_SOURCE_RANGES is empty on the ${TARGET_ENV} Environment. Set it under Settings → Environments."
            exit 1
          fi
          echo "TF_VAR_allowed_source_ranges=${ALLOWED_SOURCE_RANGES}" >> "$GITHUB_ENV"

          # Empty string must not override Terraform's null default.
          if [ -n "${GRAFANA_ADMIN_PASSWORD}" ]; then
            {
              echo "TF_VAR_grafana_admin_password<<EOF"
              echo "${GRAFANA_ADMIN_PASSWORD}"
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: Resolve state bucket from tfvars
        working-directory: ${{ github.workspace }}
        env:
          TARGET_ENV: ${{ needs.setup.outputs.environment }}
        run: |
          tfvars="environments/${TARGET_ENV}/terraform.tfvars"
          if [ ! -f "$tfvars" ]; then
            echo "::error::Missing ${tfvars}."
            exit 1
          fi

          tfvars_project_id="$(sed -nE 's/^[[:space:]]*project_id[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$tfvars" | head -n 1)"
          if [ -z "${tfvars_project_id}" ]; then
            echo "::error::Could not parse project_id from ${tfvars}."
            exit 1
          fi

          echo "TF_STATE_BUCKET=terraform-state-bucket-${tfvars_project_id}" >> "$GITHUB_ENV"
          echo "OK: state bucket terraform-state-bucket-${tfvars_project_id} from ${tfvars}."

      - name: Guard day-2 project IAM
        working-directory: ${{ github.workspace }}
        run: |
          # Project IAM belongs in bootstrap / bootstrap-iam / runner only.
          if grep -R --include='*.tf' --exclude-dir=.terraform -n 'google_project_iam_' \
            environments/dev environments/prod \
            modules/gke modules/identity modules/cloud-sql \
            modules/arc modules/external-secrets \
            modules/artifact-registry modules/middleware \
            modules/network modules/network-peering; then
            echo "::error::Day-2 paths must not declare google_project_iam_* (project IAM is bootstrap-only)"
            exit 1
          fi
          echo "OK: no google_project_iam_ under day-2 env/module paths."

      - name: Setup Terraform Cache
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> $GITHUB_ENV   

      - name: Cache Terraform Plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ../../
        continue-on-error: false

      - name: Terraform Validate
        run: terraform validate

      - name: Run TFLint
        run: tflint --init && tflint

      - name: Run TFSec
        run: tfsec . --tfvars-file terraform.tfvars

  # Plan
  plan:
    name: Terraform Plan
    needs: [setup, validate_and_scan]
    runs-on: [self-hosted, infra, "${{ needs.setup.outputs.runner_label }}"]
    # Push plans dev. Manual plan/apply save a plan; destroy saves a destroy plan for the destroy job.
    if: github.event_name == 'push' || inputs.action == 'plan' || inputs.action == 'apply' || inputs.action == 'destroy'
    environment: ${{ needs.setup.outputs.environment }}
    env:
      TF_PLUGIN_CACHE_DIR: "$HOME/.terraform.d/plugin-cache"
    defaults:
      run:
        working-directory: ${{ needs.setup.outputs.work_dir }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.ref_to_checkout }}

      - name: Inject Terraform variables from Environment
        env:
          ALLOWED_SOURCE_RANGES: ${{ vars.ALLOWED_SOURCE_RANGES }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          TARGET_ENV: ${{ needs.setup.outputs.environment }}
        run: |
          if [ -z "${ALLOWED_SOURCE_RANGES}" ]; then
            echo "::error::ALLOWED_SOURCE_RANGES is empty on the ${TARGET_ENV} Environment. Set it under Settings → Environments."
            exit 1
          fi
          echo "TF_VAR_allowed_source_ranges=${ALLOWED_SOURCE_RANGES}" >> "$GITHUB_ENV"

          # Empty string must not override Terraform's null default.
          if [ -n "${GRAFANA_ADMIN_PASSWORD}" ]; then
            {
              echo "TF_VAR_grafana_admin_password<<EOF"
              echo "${GRAFANA_ADMIN_PASSWORD}"
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: Resolve state bucket from tfvars
        working-directory: ${{ github.workspace }}
        env:
          TARGET_ENV: ${{ needs.setup.outputs.environment }}
        run: |
          tfvars="environments/${TARGET_ENV}/terraform.tfvars"
          if [ ! -f "$tfvars" ]; then
            echo "::error::Missing ${tfvars}."
            exit 1
          fi

          tfvars_project_id="$(sed -nE 's/^[[:space:]]*project_id[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$tfvars" | head -n 1)"
          if [ -z "${tfvars_project_id}" ]; then
            echo "::error::Could not parse project_id from ${tfvars}."
            exit 1
          fi

          echo "TF_STATE_BUCKET=terraform-state-bucket-${tfvars_project_id}" >> "$GITHUB_ENV"
          echo "OK: state bucket terraform-state-bucket-${tfvars_project_id} from ${tfvars}."

      - name: Setup Terraform Cache
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> $GITHUB_ENV   

      - name: Cache Terraform Plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: Terraform Plan
        if: github.event_name == 'push' || inputs.action == 'plan' || inputs.action == 'apply'
        run: terraform plan -out=tfplan -lock-timeout=5m

      - name: Terraform Destroy Plan
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: terraform plan -destroy -out=tfplan -lock-timeout=5m

      - name: Store plan in state bucket
        env:
          TARGET_ENV: ${{ needs.setup.outputs.environment }}
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ inputs.action }}
        run: |
          plan_object="gs://${TF_STATE_BUCKET}/plans/${TARGET_ENV}/${GITHUB_RUN_ID}.tfplan"
          gcloud storage cp tfplan "${plan_object}"
          rm -f tfplan
          # Apply and destroy in this run still need the object. Plan-only runs do not.
          if [ "${EVENT_NAME}" = "push" ] || [ "${ACTION}" = "plan" ]; then
            gcloud storage rm --all-versions "${plan_object}"
          fi
          echo "Plan object ${plan_object} handled for ${TARGET_ENV}."

  # Apply
  apply:
    name: Terraform Apply
    needs: [setup, plan]
    runs-on: [self-hosted, infra, "${{ needs.setup.outputs.runner_label }}"]
    # Only run if manually triggered with 'apply'
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    environment: ${{ needs.setup.outputs.environment }}
    env:
      TF_PLUGIN_CACHE_DIR: "$HOME/.terraform.d/plugin-cache"
    defaults:
      run:
        working-directory: ${{ needs.setup.outputs.work_dir }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.ref_to_checkout }}

      - name: Inject Terraform variables from Environment
        env:
          ALLOWED_SOURCE_RANGES: ${{ vars.ALLOWED_SOURCE_RANGES }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          TARGET_ENV: ${{ needs.setup.outputs.environment }}
        run: |
          if [ -z "${ALLOWED_SOURCE_RANGES}" ]; then
            echo "::error::ALLOWED_SOURCE_RANGES is empty on the ${TARGET_ENV} Environment. Set it under Settings → Environments."
            exit 1
          fi
          echo "TF_VAR_allowed_source_ranges=${ALLOWED_SOURCE_RANGES}" >> "$GITHUB_ENV"

          # Empty string must not override Terraform's null default.
          if [ -n "${GRAFANA_ADMIN_PASSWORD}" ]; then
            {
              echo "TF_VAR_grafana_admin_password<<EOF"
              echo "${GRAFANA_ADMIN_PASSWORD}"
              echo "EOF"
            } >> "$GITHUB_ENV"
          elif [ "${TARGET_ENV}" = "prod" ]; then
            echo "::error::GRAFANA_ADMIN_PASSWORD must be set on the prod Environment for apply."
            exit 1
          fi

      - name: Resolve state bucket from tfvars
        working-directory: ${{ github.workspace }}
        env:
          TARGET_ENV: ${{ needs.setup.outputs.environment }}
        run: |
          tfvars="environments/${TARGET_ENV}/terraform.tfvars"
          if [ ! -f "$tfvars" ]; then
            echo "::error::Missing ${tfvars}."
            exit 1
          fi

          tfvars_project_id="$(sed -nE 's/^[[:space:]]*project_id[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$tfvars" | head -n 1)"
          if [ -z "${tfvars_project_id}" ]; then
            echo "::error::Could not parse project_id from ${tfvars}."
            exit 1
          fi

          echo "TF_STATE_BUCKET=terraform-state-bucket-${tfvars_project_id}" >> "$GITHUB_ENV"
          echo "OK: state bucket terraform-state-bucket-${tfvars_project_id} from ${tfvars}."

      - name: Setup Terraform Cache
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> $GITHUB_ENV   

      - name: Cache Terraform Plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: Terraform Apply
        env:
          TARGET_ENV: ${{ needs.setup.outputs.environment }}
        run: |
          plan_object="gs://${TF_STATE_BUCKET}/plans/${TARGET_ENV}/${GITHUB_RUN_ID}.tfplan"
          gcloud storage cp "${plan_object}" tfplan
          terraform apply -lock-timeout=5m tfplan
          rm -f tfplan

      - name: Delete applied plan
        if: success()
        env:
          TARGET_ENV: ${{ needs.setup.outputs.environment }}
        run: |
          plan_object="gs://${TF_STATE_BUCKET}/plans/${TARGET_ENV}/${GITHUB_RUN_ID}.tfplan"
          if ! gcloud storage rm --all-versions "${plan_object}"; then
            echo "::warning::Failed to delete ${plan_object}. The 1-day plans/ lifecycle will remove it."
            exit 0
          fi

  # Destroy applies the destroy plan saved by the plan job. No auto-approve destroy.
  destroy:
    name: Terraform Destroy
    needs: [setup, plan]
    runs-on: [self-hosted, infra, "${{ needs.setup.outputs.runner_label }}"]
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    environment: ${{ needs.setup.outputs.environment }}
    env:
      TF_PLUGIN_CACHE_DIR: "$HOME/.terraform.d/plugin-cache"
    defaults:
      run:
        working-directory: ${{ needs.setup.outputs.work_dir }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.ref_to_checkout }}

      - name: Inject Terraform variables from Environment
        env:
          ALLOWED_SOURCE_RANGES: ${{ vars.ALLOWED_SOURCE_RANGES }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          TARGET_ENV: ${{ needs.setup.outputs.environment }}
        run: |
          if [ -z "${ALLOWED_SOURCE_RANGES}" ]; then
            echo "::error::ALLOWED_SOURCE_RANGES is empty on the ${TARGET_ENV} Environment. Set it under Settings → Environments."
            exit 1
          fi
          echo "TF_VAR_allowed_source_ranges=${ALLOWED_SOURCE_RANGES}" >> "$GITHUB_ENV"

          # Empty string must not override Terraform's null default.
          if [ -n "${GRAFANA_ADMIN_PASSWORD}" ]; then
            {
              echo "TF_VAR_grafana_admin_password<<EOF"
              echo "${GRAFANA_ADMIN_PASSWORD}"
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: Resolve state bucket from tfvars
        working-directory: ${{ github.workspace }}
        env:
          TARGET_ENV: ${{ needs.setup.outputs.environment }}
        run: |
          tfvars="environments/${TARGET_ENV}/terraform.tfvars"
          if [ ! -f "$tfvars" ]; then
            echo "::error::Missing ${tfvars}."
            exit 1
          fi

          tfvars_project_id="$(sed -nE 's/^[[:space:]]*project_id[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$tfvars" | head -n 1)"
          if [ -z "${tfvars_project_id}" ]; then
            echo "::error::Could not parse project_id from ${tfvars}."
            exit 1
          fi

          echo "TF_STATE_BUCKET=terraform-state-bucket-${tfvars_project_id}" >> "$GITHUB_ENV"
          echo "OK: state bucket terraform-state-bucket-${tfvars_project_id} from ${tfvars}."

      - name: Setup Terraform Cache
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> $GITHUB_ENV   

      - name: Cache Terraform Plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: Terraform Apply Destroy Plan
        env:
          TARGET_ENV: ${{ needs.setup.outputs.environment }}
        run: |
          plan_object="gs://${TF_STATE_BUCKET}/plans/${TARGET_ENV}/${GITHUB_RUN_ID}.tfplan"
          gcloud storage cp "${plan_object}" tfplan
          terraform apply -lock-timeout=5m tfplan
          rm -f tfplan

      - name: Delete applied destroy plan
        if: success()
        env:
          TARGET_ENV: ${{ needs.setup.outputs.environment }}
        run: |
          plan_object="gs://${TF_STATE_BUCKET}/plans/${TARGET_ENV}/${GITHUB_RUN_ID}.tfplan"
          if ! gcloud storage rm --all-versions "${plan_object}"; then
            echo "::warning::Failed to delete ${plan_object}. The 1-day plans/ lifecycle will remove it."
            exit 0
          fi
