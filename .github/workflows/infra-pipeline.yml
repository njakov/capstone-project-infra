name: Main Infrastructure Pipeline

on:
  # Automatic Trigger: Runs 'Plan' on Dev when code is pushed to main
  push:
    branches: [ "main" ]
    paths:
      - 'environments/**'
      - 'modules/**'
      - '.github/workflows/infra-pipeline.yml'

  # Manual Trigger: Allows selecting Environment and Action
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      action:
        description: 'Terraform Action'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
      ref:
        description: 'Branch/Tag to checkout (Optional)'
        required: false
        type: string

permissions:
  contents: read

# Prevent overlapping runs on the same environment
concurrency:
  group: ${{ github.workflow }}-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  setup:
    name: Setup Context
    runs-on: ubuntu-latest
    outputs:
      runner_label: ${{ steps.set-context.outputs.runner_label }}
      work_dir: ${{ steps.set-context.outputs.work_dir }}
      environment: ${{ steps.set-context.outputs.environment }}
      ref_to_checkout: ${{ steps.set-context.outputs.ref_to_checkout }}
    steps:
      - id: set-context
        name: Determine Context
        env:
          INPUT_ENV: ${{ inputs.environment }}
          INPUT_REF: ${{ inputs.ref }}
          GITHUB_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # 1. Determine Environment & Ref
          if [ "$EVENT_NAME" = "push" ]; then
            ENV="dev"
            REF="${GITHUB_REF#refs/heads/}"
          else
            ENV="${INPUT_ENV:-dev}"
            REF="${INPUT_REF:-${GITHUB_REF#refs/heads/}}"
          fi

          case "$ENV" in
            dev|prod) ;;
            *)
              echo "::error::Invalid environment."
              exit 1
              ;;
          esac

          # A newline in ref would add extra $GITHUB_OUTPUT lines and overwrite
          # environment, work_dir, or runner_label. EOF is the output delimiter.
          case "$REF" in
            ""|EOF|*$'\n'*|*$'\r'*)
              echo "::error::Invalid ref."
              exit 1
              ;;
          esac

          # 2. Safety Guard: Block Prod deployments from non-main branches
          if [ "$ENV" = "prod" ] && [ "$REF" != "main" ]; then
            echo "::error title=Deployment Denied::Production deployments are strictly limited to the 'main' branch. You tried: $REF"
            exit 1
          fi

          # 3. Output Variables
          echo "Selected Environment: $ENV"
          echo "Selected Ref: $REF"

          {
            echo "environment<<EOF"
            echo "$ENV"
            echo "EOF"
            echo "work_dir<<EOF"
            echo "environments/$ENV"
            echo "EOF"
            echo "runner_label<<EOF"
            echo "$ENV"
            echo "EOF"
            echo "ref_to_checkout<<EOF"
            echo "$REF"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  # Validate & Scan
  validate_and_scan:
    name: Validate & Scan
    needs: setup
    runs-on: [self-hosted, infra, "${{ needs.setup.outputs.runner_label }}"]
    # GitHub Environment is for deployment protection, not GCP project ids.
    environment: ${{ needs.setup.outputs.environment }}
    defaults:
      run:
        working-directory: ${{ needs.setup.outputs.work_dir }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.ref_to_checkout }}

      - name: Resolve state bucket from tfvars
        working-directory: ${{ github.workspace }}
        env:
          TARGET_ENV: ${{ needs.setup.outputs.environment }}
        run: |
          tfvars="environments/${TARGET_ENV}/terraform.tfvars"
          if [ ! -f "$tfvars" ]; then
            echo "::error::Missing ${tfvars}."
            exit 1
          fi

          tfvars_project_id="$(sed -nE 's/^[[:space:]]*project_id[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$tfvars" | head -n 1)"
          if [ -z "${tfvars_project_id}" ]; then
            echo "::error::Could not parse project_id from ${tfvars}."
            exit 1
          fi

          echo "TF_STATE_BUCKET=terraform-state-bucket-${tfvars_project_id}" >> "$GITHUB_ENV"
          echo "OK: state bucket terraform-state-bucket-${tfvars_project_id} from ${tfvars}."

      - name: Guard day-2 project IAM
        working-directory: ${{ github.workspace }}
        run: |
          # Project IAM belongs in bootstrap / bootstrap-iam / runner only.
          if grep -R --include='*.tf' --exclude-dir=.terraform -n 'google_project_iam_' \
            environments/dev environments/prod \
            modules/gke modules/identity modules/cloud-sql \
            modules/arc modules/external-secrets; then
            echo "::error::Day-2 paths must not declare google_project_iam_* (project IAM is bootstrap-only)"
            exit 1
          fi
          echo "OK: no google_project_iam_ under day-2 env/module paths."

      - name: Setup Terraform Cache
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> $GITHUB_ENV   

      - name: Cache Terraform Plugins
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ../../
        continue-on-error: false

      - name: Terraform Validate
        run: terraform validate

      - name: Run TFLint
        run: tflint --init && tflint

      - name: Run TFSec
        run: tfsec .

  # Plan
  plan:
    name: Terraform Plan
    needs: [setup, validate_and_scan]
    runs-on: [self-hosted, infra, "${{ needs.setup.outputs.runner_label }}"]
    # Push plans dev. Manual plan/apply save a plan; destroy saves a destroy plan for the destroy job.
    if: github.event_name == 'push' || inputs.action == 'plan' || inputs.action == 'apply' || inputs.action == 'destroy'
    environment: ${{ needs.setup.outputs.environment }}
    env:
      TF_PLUGIN_CACHE_DIR: "$HOME/.terraform.d/plugin-cache"
    defaults:
      run:
        working-directory: ${{ needs.setup.outputs.work_dir }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.ref_to_checkout }}

      - name: Resolve state bucket from tfvars
        working-directory: ${{ github.workspace }}
        env:
          TARGET_ENV: ${{ needs.setup.outputs.environment }}
        run: |
          tfvars="environments/${TARGET_ENV}/terraform.tfvars"
          if [ ! -f "$tfvars" ]; then
            echo "::error::Missing ${tfvars}."
            exit 1
          fi

          tfvars_project_id="$(sed -nE 's/^[[:space:]]*project_id[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$tfvars" | head -n 1)"
          if [ -z "${tfvars_project_id}" ]; then
            echo "::error::Could not parse project_id from ${tfvars}."
            exit 1
          fi

          echo "TF_STATE_BUCKET=terraform-state-bucket-${tfvars_project_id}" >> "$GITHUB_ENV"
          echo "OK: state bucket terraform-state-bucket-${tfvars_project_id} from ${tfvars}."

      - name: Setup Terraform Cache
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> $GITHUB_ENV   

      - name: Cache Terraform Plugins
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: Terraform Plan
        if: github.event_name == 'push' || inputs.action == 'plan' || inputs.action == 'apply'
        run: terraform plan -out=tfplan -lock-timeout=5m

      - name: Terraform Destroy Plan
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: terraform plan -destroy -out=tfplan -lock-timeout=5m

      - name: Store plan in state bucket
        env:
          TARGET_ENV: ${{ needs.setup.outputs.environment }}
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ inputs.action }}
        run: |
          plan_object="gs://${TF_STATE_BUCKET}/plans/${TARGET_ENV}/${GITHUB_RUN_ID}.tfplan"
          gcloud storage cp tfplan "${plan_object}"
          rm -f tfplan
          # Apply and destroy in this run still need the object. Plan-only runs do not.
          if [ "${EVENT_NAME}" = "push" ] || [ "${ACTION}" = "plan" ]; then
            gcloud storage rm --all-versions "${plan_object}"
          fi
          echo "Plan object ${plan_object} handled for ${TARGET_ENV}."

  # Apply
  apply:
    name: Terraform Apply
    needs: [setup, plan]
    runs-on: [self-hosted, infra, "${{ needs.setup.outputs.runner_label }}"]
    # Only run if manually triggered with 'apply'
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    environment: ${{ needs.setup.outputs.environment }}
    env:
      TF_PLUGIN_CACHE_DIR: "$HOME/.terraform.d/plugin-cache"
    defaults:
      run:
        working-directory: ${{ needs.setup.outputs.work_dir }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.ref_to_checkout }}

      - name: Resolve state bucket from tfvars
        working-directory: ${{ github.workspace }}
        env:
          TARGET_ENV: ${{ needs.setup.outputs.environment }}
        run: |
          tfvars="environments/${TARGET_ENV}/terraform.tfvars"
          if [ ! -f "$tfvars" ]; then
            echo "::error::Missing ${tfvars}."
            exit 1
          fi

          tfvars_project_id="$(sed -nE 's/^[[:space:]]*project_id[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$tfvars" | head -n 1)"
          if [ -z "${tfvars_project_id}" ]; then
            echo "::error::Could not parse project_id from ${tfvars}."
            exit 1
          fi

          echo "TF_STATE_BUCKET=terraform-state-bucket-${tfvars_project_id}" >> "$GITHUB_ENV"
          echo "OK: state bucket terraform-state-bucket-${tfvars_project_id} from ${tfvars}."

      - name: Setup Terraform Cache
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> $GITHUB_ENV   

      - name: Cache Terraform Plugins
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: Terraform Apply
        env:
          TARGET_ENV: ${{ needs.setup.outputs.environment }}
        run: |
          plan_object="gs://${TF_STATE_BUCKET}/plans/${TARGET_ENV}/${GITHUB_RUN_ID}.tfplan"
          gcloud storage cp "${plan_object}" tfplan
          set +e
          terraform apply -lock-timeout=5m tfplan
          status=$?
          gcloud storage rm --all-versions "${plan_object}"
          rm_status=$?
          rm -f tfplan
          if [ "${status}" -ne 0 ]; then
            exit "${status}"
          fi
          exit "${rm_status}"

  # Destroy applies the destroy plan saved by the plan job. No auto-approve destroy.
  destroy:
    name: Terraform Destroy
    needs: [setup, plan]
    runs-on: [self-hosted, infra, "${{ needs.setup.outputs.runner_label }}"]
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    environment: ${{ needs.setup.outputs.environment }}
    env:
      TF_PLUGIN_CACHE_DIR: "$HOME/.terraform.d/plugin-cache"
    defaults:
      run:
        working-directory: ${{ needs.setup.outputs.work_dir }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.ref_to_checkout }}

      - name: Resolve state bucket from tfvars
        working-directory: ${{ github.workspace }}
        env:
          TARGET_ENV: ${{ needs.setup.outputs.environment }}
        run: |
          tfvars="environments/${TARGET_ENV}/terraform.tfvars"
          if [ ! -f "$tfvars" ]; then
            echo "::error::Missing ${tfvars}."
            exit 1
          fi

          tfvars_project_id="$(sed -nE 's/^[[:space:]]*project_id[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$tfvars" | head -n 1)"
          if [ -z "${tfvars_project_id}" ]; then
            echo "::error::Could not parse project_id from ${tfvars}."
            exit 1
          fi

          echo "TF_STATE_BUCKET=terraform-state-bucket-${tfvars_project_id}" >> "$GITHUB_ENV"
          echo "OK: state bucket terraform-state-bucket-${tfvars_project_id} from ${tfvars}."

      - name: Setup Terraform Cache
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> $GITHUB_ENV   

      - name: Cache Terraform Plugins
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: Terraform Apply Destroy Plan
        env:
          TARGET_ENV: ${{ needs.setup.outputs.environment }}
        run: |
          plan_object="gs://${TF_STATE_BUCKET}/plans/${TARGET_ENV}/${GITHUB_RUN_ID}.tfplan"
          gcloud storage cp "${plan_object}" tfplan
          set +e
          terraform apply -lock-timeout=5m tfplan
          status=$?
          gcloud storage rm --all-versions "${plan_object}"
          rm_status=$?
          rm -f tfplan
          if [ "${status}" -ne 0 ]; then
            exit "${status}"
          fi
          exit "${rm_status}"